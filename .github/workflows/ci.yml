name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Expo app (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency / config check
        run: npx expo-doctor
      - name: Unit tests
        run: npm test
      - name: Bundle JS (Metro export)
        run: npx expo export --platform ios
